[tools]
pnpm = "11"
node = "26.3"
prek = "latest"

[tasks.dev]
description = "Run dev environment for live website changes"
run = "pnpm run dev"

[tasks.build]
depends = "test"
description = "Build the web Application"
run = "pnpm run build"

[tasks.preview]
depends = "build"
description = "Preview the web Application locally"
run = "pnpm run preview"

[tasks.test]
depends = "coverage"
description = "Test the web Applications for compile errors"
run = "pnpm run test"

[tasks.fmt-check]
description = "Run formatter in package.json"
run = "pnpm run fmt:check"

[tasks.coverage]
depends = "fmt-check"
description = "Run vitest for coverage testing"
run = "pnpm run coverage"

[tasks.lint]
depends = "fmt-check"
description = "Lint the code"
run = "pnpm run lint"
