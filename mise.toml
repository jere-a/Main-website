[tools]
pnpm = "11"
node = "26.3"
prek = "latest"

[env]
_.path = "./node_modules/.bin"

[tasks.install]
description = "Install dependencies"
run = "pnpm install --frozen-lockfile --prefer-offline"

[tasks.fmt-check]
depends = "install"
deny_all = true
allow_read = ["."]
description = "Check formatting"
run = "oxfmt --check"

[tasks.lint]
depends = "install"
description = "Lint source code"
run = "oxlint"

[tasks.astro-check]
depends = "install"
description = "Check Astro and TypeScript"
run = "astro check"

[tasks.checks]
description = "Run static checks"
depends = ["fmt-check", "astro-check"]

[tasks.preview]
description = "Preview the website as build"
depends = ["build"]
run = "astro preview"

[tasks.test]
description = "Run unit tests"
depends = ["checks"]
run = "vitest run"

[tasks.build]
description = "Build application"
depends = ["test"]
run = "astro build"

[tasks.mutate]
description = "Run Stryker mutation testing"
depends = ["install"]
run = "stryker run"

[tasks.unit-test]
description = "Run unit tests (no pre-checks)"
depends = ["install"]
run = "vitest run"

[tasks.ci]
description = "Complete CI pipeline"
depends = ["build"]
run = "astro build"
