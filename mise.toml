[tools]
pnpm = "11"
node = "26.3"
prek = "latest"

[env]
_.path = "./node_modules/.bin"

[tasks.install]
description = "Install dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.fmt-check]
depends = "install"
deny_all = true
allow_read = ["."]
description = "Check formatting"
run = "oxfmt --check"

[tasks.lint]
depends = "install"
description = "Lint source code"
run = "oxlint"

[tasks.astro-check]
depends = "install"
description = "Check Astro and TypeScript"
run = "astro check"

[tasks.checks]
description = "Run static checks"
depends = ["fmt-check", "astro-check"]

[tasks.test]
description = "Run unit tests"
depends = ["checks"]
run = "vitest run"

[tasks.coverage]
description = "Run tests with coverage"
depends = ["checks"]
run = "vitest run --coverage"

[tasks.build]
description = "Build application"
depends = ["checks"]
run = "astro build"

[tasks.ci]
description = "Complete CI pipeline"
depends = ["coverage", "build"]
